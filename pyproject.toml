[project]
name = "molrecognizer"
version = "0.1.0"
description = "Recognize molecular structures from images, convert to SMILES, and edit interactively"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rdkit-pypi",
    "Pillow",
    "PySide6",
    "molscribe",
    "huggingface-hub",
    "numpy<2",
]

[project.scripts]
molrecognizer = "molrecognizer.gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/molrecognizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest"]
