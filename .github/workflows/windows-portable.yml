name: Windows portable preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "packaging/windows/**"
      - "pyproject.toml"
      - ".github/workflows/windows-portable.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: x64
      - name: Install application and build dependencies
        run: python -m pip install . -r packaging/windows/requirements-build.txt
      - name: Run regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -m "not slow" -q
      # Explicitly a preview until a reviewed, source-traceable Windows OSRA
      # distribution is available. Never silently publish this as a full build.
      - name: Build and smoke-test portable editor preview
        run: python packaging/windows/build.py --without-osra
      - name: Upload preview (not a GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: MolRecognizer-windows-x64-no-osra
          path: |
            dist/*-no-osra.zip
            dist/*-no-osra.zip.sha256
          if-no-files-found: error
          retention-days: 14
